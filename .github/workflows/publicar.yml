# Publica o site no GitHub Pages.
# Roda: a cada push na main, de hora em hora (para puxar devocional, mensagens
# e agenda novos do Supabase) e quando alguem clica "Run workflow".
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Endereco de teste. Na virada do dominio: SITE=https://penielchurch.org.uk e BASE=/
          SITE: https://marcoslbrandao.github.io
          BASE: /peniel-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
